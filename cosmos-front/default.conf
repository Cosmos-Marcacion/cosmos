server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # Aunque un dato con codigo llegara a ejecutarse en el panel, el navegador
    # no le deja cargar scripts de fuera ni enviar nada a otro servidor:
    # `connect-src` e `img-src` solo admiten la API y los ficheros de S3
    # (mas Google Fonts, de donde sale la Raleway de styles.scss).
    # `script-src 'self'` exige que el build no emita manejadores en linea;
    # por eso `inlineCritical` va desactivado en angular.json. Los estilos si
    # necesitan 'unsafe-inline': Angular inserta los de cada componente.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.amazonaws.com https://stcosmosckarchivos.blob.core.windows.net https://apicheckin.cosmos.com.pe; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://apicheckin.cosmos.com.pe; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}