<div class="p-4 md:p-8">
  <div
    class="w-full flex flex-col md:flex-row md:justify-between md:items-center gap-4"
  >
    <div class="flex flex-col justify-center gap-2 w-full md:w-auto">
      <label for="port" class="text-color1-40 text-sm font-bold"
        >Puerto</label
      >
      <select
        name="port"
        id="port"
        class="w-full md:w-80 p-3 rounded-md border border-color2"
        [(ngModel)]="portId"
        (change)="changePort(portId)"
      >
        <option value="">Seleccionar puerto</option>
        @for (port of ports; track port._id) {
        <option [value]="port._id">{{ port.name }}</option>
        }
      </select>
    </div>
    <div class="flex items-center gap-2 md:justify-end">
      <button
        class="bg-color1 text-white px-4 py-3 rounded-md flex items-center justify-between gap-2 gilroy-bold w-full md:w-auto"
        (click)="addPoint()"
      >
        Agregar
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-6"
        >
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 9a.75.75 0 0 0-1.5 0v2.25H9a.75.75 0 0 0 0 1.5h2.25V15a.75.75 0 0 0 1.5 0v-2.25H15a.75.75 0 0 0 0-1.5h-2.25V9Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>
  <div class="mt-8">
    <app-data
      [headers]="headers"
      [data]="points"
      (optionsEvent)="clickOptions($event.option, $event._id)"
      [total]="total"
      [page]="page"
      [limit]="limit"
      [showExcelDownload]="true"
      [excelConfig]="getExcelConfig()"
      (pageChangeEvent)="pageChange($event)"
      (excelDownloadEvent)="onExcelDownload($event)"
      [loading]="loading"
      [error]="error"
      [retryable]="true"
      (retryEvent)="retry()"
      [emptyMessage]="emptyMessage"
    ></app-data>
  </div>
</div>
