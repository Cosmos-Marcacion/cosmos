@if (showSplash) {
  <div class="splash-container">
    <div class="splash-content">
      <div class="logo-container">
        <img
          src="/images/cosmos-logotipo-blanco.png"
          alt="Cosmos Global Logistics"
          class="logo"
        />
      </div>

      <div class="text-container">
        <h1 class="splash-title">
          Sistema de Marcaciones de Trabajadores Portuarios
        </h1>
      </div>

      <div class="splash-footer">
        <img
          src="/images/cosmos-isotipo-blanco.png"
          alt=""
          aria-hidden="true"
          class="isotipo"
        />
      </div>
    </div>
  </div>
}
